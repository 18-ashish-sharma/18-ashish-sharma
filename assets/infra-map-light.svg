<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">How the work fits together</title>
<desc id="d">A six-stage loop. 01 Code in Git with pull-request review. 02 CI/CD on GitHub Actions, GitLab CI and Azure DevOps with OIDC and an approval-gated apply. 03 Terraform modules and remote state, gated by tflint, checkov and gitleaks. 04 Cloud: AWS EKS, Lambda, RDS and IAM, and Azure App Service and Key Vault. 05 Observability: Prometheus, Grafana, Fluent Bit to OpenSearch with SAML sign-in. 06 FinOps: AWS Budgets with SNS alerts and scheduled EC2 and RDS stop-start. Metrics and spend feed the next change. Each stage names the repository that shows it.</desc>
<style>
.flow { fill: none; stroke-width: 2.4; stroke-dasharray: 7 7; animation: dash 1.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
