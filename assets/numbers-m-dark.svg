<title id="t">By the numbers</title>
<desc id="d">By the numbers, counted from six public repositories: 10 Terraform modules; 19 pipeline definitions (16 GitHub Actions workflows, 1 GitLab CI pipeline, 2 Azure DevOps pipelines); 26 automated tests (13 pytest, 7 terraform test runs, 5 JUnit, 1 Vitest); 0 cloud keys stored in CI, because deploys sign in with OIDC and checks run without credentials.</desc>
