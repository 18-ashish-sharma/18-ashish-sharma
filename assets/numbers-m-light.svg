<title id="t">By the numbers</title>
<desc id="d">By the numbers, counted from the public repositories: 6 Terraform modules; 6 pipeline definitions (4 GitHub Actions workflows and 2 Azure DevOps pipelines); 26 automated tests (14 pytest, 7 terraform test runs, 5 JUnit); 0 cloud keys stored in CI, because deploys sign in with OIDC and checks run without credentials.</desc>
